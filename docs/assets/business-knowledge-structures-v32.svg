<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150">
<title>统一底座与多领域业务知识结构</title>
<rect width="100%" height="100%" fill="white"/>
<text x="42" y="24" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">统一底座  多领域结构  多种应用视图</text>
<text x="42" y="76" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">按业务含义建模，按责任与安全管理，按任务组合使用。</text>
<rect x="42" y="115" width="916" height="155" rx="8" fill="#eaf1ff"/>
<text x="60" y="129" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">上层应用视图</text>
<rect x="60" y="175" width="280" height="75" rx="8" fill="#ffffff"/>
<text x="71" y="184" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">员工助手</text>
<text x="71" y="222" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">办事说明与适用条件</text>
<rect x="358" y="175" width="280" height="75" rx="8" fill="#ffffff"/>
<text x="369" y="184" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">流程 Agent</text>
<text x="369" y="222" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">前置条件与办理步骤</text>
<rect x="656" y="175" width="280" height="75" rx="8" fill="#ffffff"/>
<text x="667" y="184" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">研究等 Agent</text>
<text x="667" y="222" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">关联知识与证据包</text>
<rect x="42" y="305" width="916" height="105" rx="8" fill="#eaf6f4"/>
<text x="60" y="319" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#237b70" dominant-baseline="text-before-edge">统一知识服务出口</text>
<text x="60" y="365" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">选择领域与对象 → 核对含义和条件 → 按身份与用途返回知识</text>
<rect x="42" y="445" width="916" height="290" rx="8" fill="#f0edfc"/>
<text x="60" y="460" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#6c53a0" dominant-baseline="text-before-edge">业务领域可以维护不同结构</text>
<rect x="60" y="510" width="280" height="165" rx="8" fill="#ffffff"/>
<text x="71" y="524" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">示意员工服务域</text>
<text x="71" y="570" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">人员、办理事项、制度</text>
<text x="71" y="603" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">适用、前置与负责关系</text>
<text x="71" y="636" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">本领域规则与维护责任</text>
<rect x="358" y="510" width="280" height="165" rx="8" fill="#ffffff"/>
<text x="369" y="524" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">示意客户支持域</text>
<text x="369" y="570" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">客户、请求、解决方案</text>
<text x="369" y="603" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">关联、例外与处理关系</text>
<text x="369" y="636" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">本领域规则与维护责任</text>
<rect x="656" y="510" width="280" height="165" rx="8" fill="#ffffff"/>
<text x="667" y="524" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">其他业务领域</text>
<text x="667" y="570" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">按自身对象与规则建模</text>
<text x="667" y="603" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">共享定义须共同确认</text>
<text x="667" y="636" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">采用模板后仍需验证</text>
<text x="60" y="697" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">跨域含义显式映射；相同事实不按应用重复维护。</text>
<rect x="42" y="770" width="916" height="145" rx="8" fill="#edf5fb"/>
<text x="60" y="785" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">平台共用规范与企业共享定义</text>
<text x="60" y="833" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">统一知识身份、来源证据、版本状态、授权与服务合同</text>
<text x="60" y="871" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">只共享经确认的业务定义，各领域保留含义与变更责任。</text>
<rect x="42" y="950" width="916" height="110" rx="8" fill="#f1f4f7"/>
<text x="60" y="966" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">目录与标签分别服务管理和查找</text>
<text x="60" y="1011" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">目录管归档与接入范围；标签做多面筛选；两者映射到知识。</text>
<path d="M500,301 L500,274 M495,282 L500,274 L505,282" fill="none" stroke="#8798af" stroke-width="3"/>
<path d="M500,441 L500,414 M495,422 L500,414 L505,422" fill="none" stroke="#8798af" stroke-width="3"/>
<path d="M500,766 L500,739 M495,747 L500,739 L505,747" fill="none" stroke="#8798af" stroke-width="3"/>
<text x="42" y="1091" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">领域模型、知识库空间和目录不是一一对应，复用不扩大内容权限。</text>
<text x="42" y="1126" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">示意结构须由业务问题、实际资料和领域责任人共同验证。</text>
</svg>