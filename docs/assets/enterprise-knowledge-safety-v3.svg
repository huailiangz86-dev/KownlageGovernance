<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010">
<title>知识使用前的安全判断</title>
<rect width="100%" height="100%" fill="white"/>
<text x="42" y="28" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">一次知识使用怎样被允许</text>
<text x="42" y="83" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">适用于员工、搜索问答、共享链接和应用调用</text>
<rect x="42" y="140" width="720" height="103" rx="8" fill="#edf5fb"/>
<text x="60" y="154" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">身份有效</text>
<text x="60" y="199" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">人员仍在职且有成员资格，应用凭证未到期</text>
<line x1="400" y1="247" x2="400" y2="261" stroke="#8e9cb0" stroke-width="3"/>
<polygon points="400,261 395,253 405,253" fill="#8e9cb0"/>
<line x1="765" y1="191" x2="797" y2="191" stroke="#b86b6b" stroke-width="3"/>
<polygon points="797,191 789,186 789,196" fill="#b86b6b"/>
<rect x="42" y="266" width="720" height="103" rx="8" fill="#edf5fb"/>
<text x="60" y="280" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">允许这个动作</text>
<text x="60" y="325" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">读知识、看原件、下载和外发分别授权</text>
<line x1="400" y1="373" x2="400" y2="387" stroke="#8e9cb0" stroke-width="3"/>
<polygon points="400,387 395,379 405,379" fill="#8e9cb0"/>
<line x1="765" y1="317" x2="797" y2="317" stroke="#b86b6b" stroke-width="3"/>
<polygon points="797,317 789,312 789,322" fill="#b86b6b"/>
<rect x="42" y="392" width="720" height="103" rx="8" fill="#edf5fb"/>
<text x="60" y="406" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">允许这个范围</text>
<text x="60" y="451" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">知识库、目录、来源限制与指定受众均满足</text>
<line x1="400" y1="499" x2="400" y2="513" stroke="#8e9cb0" stroke-width="3"/>
<polygon points="400,513 395,505 405,505" fill="#8e9cb0"/>
<line x1="765" y1="443" x2="797" y2="443" stroke="#b86b6b" stroke-width="3"/>
<polygon points="797,443 789,438 789,448" fill="#b86b6b"/>
<rect x="42" y="518" width="720" height="103" rx="8" fill="#edf5fb"/>
<text x="60" y="532" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">内容当前可用</text>
<text x="60" y="577" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">正式版本、适用条件、有效期与来源状态均通过</text>
<line x1="400" y1="625" x2="400" y2="639" stroke="#8e9cb0" stroke-width="3"/>
<polygon points="400,639 395,631 405,631" fill="#8e9cb0"/>
<line x1="765" y1="569" x2="797" y2="569" stroke="#b86b6b" stroke-width="3"/>
<polygon points="797,569 789,564 789,574" fill="#b86b6b"/>
<rect x="42" y="644" width="720" height="103" rx="8" fill="#edf5fb"/>
<text x="60" y="658" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#253650" dominant-baseline="text-before-edge">用途和传播符合要求</text>
<text x="60" y="703" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">内部阅读许可不自动成为对外调用或导出许可</text>
<line x1="765" y1="695" x2="797" y2="695" stroke="#b86b6b" stroke-width="3"/>
<polygon points="797,695 789,690 789,700" fill="#b86b6b"/>
<rect x="800" y="140" width="155" height="607" rx="8" fill="#fbefef"/>
<text x="812" y="236" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#9b4242" dominant-baseline="text-before-edge">任一不满足</text>
<text x="812" y="293" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#9b4242" dominant-baseline="text-before-edge">拒绝该动作</text>
<text x="812" y="350" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#9b4242" dominant-baseline="text-before-edge">不返回</text>
<text x="812" y="407" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#9b4242" dominant-baseline="text-before-edge">受限标题</text>
<text x="812" y="464" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#9b4242" dominant-baseline="text-before-edge">或正文</text>
<text x="812" y="521" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#9b4242" dominant-baseline="text-before-edge">留必要记录</text>
<line x1="400" y1="751" x2="400" y2="783" stroke="#8e9cb0" stroke-width="3"/>
<polygon points="400,783 395,775 405,775" fill="#8e9cb0"/>
<rect x="42" y="786" width="913" height="104" rx="8" fill="#eaf6f4"/>
<text x="62" y="803" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#237b70" dominant-baseline="text-before-edge">全部满足才提供本次允许的内容</text>
<text x="62" y="848" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">返回知识版本、条件和引用，记录必要使用信息。</text>
<text x="42" y="932" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">业务标签帮助查找；安全属性参与规则，但都不能单独授予权限。</text>
<text x="42" y="970" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#253650" dominant-baseline="text-before-edge">目标规则  权限变化后重新判断，不靠旧会话、缓存或链接继续放行。</text>
</svg>