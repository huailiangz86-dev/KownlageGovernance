<text x="80" y="791" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#23354c" dominant-baseline="text-before-edge">5  索引投影与代次</text>
<text x="80" y="840" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#23354c" dominant-baseline="text-before-edge">BM25 / dense / 视觉通道</text>
<path d="M385,889 L385,910 M379,901 L385,910 L391,901" fill="none" stroke="#8a9bb0" stroke-width="3"/>
