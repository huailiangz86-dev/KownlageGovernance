<text x="80" y="981" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#23354c" dominant-baseline="text-before-edge">事实事务 · Outbox · 水位与失效</text>
<rect x="790" y="210" width="650" height="110" rx="10" fill="#eaf1ff"/>
