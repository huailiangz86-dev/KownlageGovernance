<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280">
<title>知识库引擎构建与查询流水线</title>
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="30" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#23354c" dominant-baseline="text-before-edge">知识库引擎核心流水线</text>
<text x="60" y="90" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#23354c" dominant-baseline="text-before-edge">目标设计  |  构建可追溯的索引，返回经过授权的证据</text>
<text x="80" y="154" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#237b70" dominant-baseline="text-before-edge">构建与更新链路</text>
<text x="810" y="154" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#3568c0" dominant-baseline="text-before-edge">检索与问答链路</text>
