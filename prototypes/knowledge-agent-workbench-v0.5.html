<div id="kg-v05" aria-label="资料治理 Agent 工作台概念原型">
  <aside class="kg-side">
    <div class="kg-brand"><b>G</b><span>资料治理 Agent<small>工作台概念 · v0.5</small></span></div>
    <button class="kg-project" data-page="settings" type="button">A 产品资料 <span>项目设置</span></button>
    <nav class="kg-nav" aria-label="产品导航"></nav>
    <div class="kg-side-note">模拟数据与状态<br>不连接真实来源或 Agent</div>
  </aside>
  <section class="kg-main">
    <header class="kg-top"><span id="kg-breadcrumb">工作台</span><div><span class="kg-dot"></span>维护范围已启用 <button class="kg-text" data-page="settings" type="button">查看边界</button></div></header>
    <main id="kg-view"></main>
    <div id="kg-toast" aria-live="polite"></div>
  </section>
</div>
<style>
#kg-v05{--bg:light-dark(#fbfcfb,#161b1f);--side:light-dark(#f0f4f2,#111619);--card:light-dark(#fff,#1d252a);--soft:light-dark(#e8f3ed,#1d3630);--line:light-dark(#d8e0dc,#334047);--text:light-dark(#17231e,#e7eeeb);--muted:light-dark(#60716a,#aab9b2);--green:light-dark(#0d6b4f,#91dfbf);--greenText:light-dark(#fff,#0d2b20);--amber:light-dark(#8a5b0c,#e8c878);--amberBg:light-dark(#fdf3db,#3b301f);--red:light-dark(#a24040,#f1aaaa);font:14px/1.55 Inter,"Microsoft YaHei",sans-serif;color:var(--text);color-scheme:light dark;max-width:1100px;margin:auto}
#kg-v05 *{box-sizing:border-box}#kg-v05 .kg-side{background:var(--side);padding:22px 14px;min-width:188px;border-right:1px solid var(--line)}#kg-v05{display:grid;grid-template-columns:188px minmax(0,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
#kg-v05 .kg-brand{display:flex;gap:9px;align-items:center;font-weight:600}#kg-v05 .kg-brand b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--green);color:var(--greenText)}#kg-v05 small{display:block;color:var(--muted);font-size:12px;font-weight:400}#kg-v05 .kg-project{width:100%;display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;text-align:left}#kg-v05 .kg-project span{font-size:11px;color:var(--muted)}
#kg-v05 .kg-nav{display:grid;gap:3px}#kg-v05 button{font:inherit;color:var(--text);border-radius:8px;border:1px solid var(--line);background:var(--card);padding:8px 10px;cursor:pointer}#kg-v05 button:hover{background:var(--soft)}#kg-v05 .kg-nav button{border:0;background:transparent;text-align:left;font-weight:400}#kg-v05 .kg-nav button[aria-current="page"]{background:var(--soft);color:var(--green);font-weight:600}#kg-v05 .kg-side-note{margin-top:30px;color:var(--muted);font-size:12px}.kg-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 24px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.kg-dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:4px}.kg-text{border:0!important;background:transparent!important;color:var(--green)!important;padding:0!important;margin-left:6px}.kg-main{min-width:0}.kg-main main{padding:26px}
#kg-v05 h1{font-size:24px;line-height:1.25;margin:0 0 6px;font-weight:600}#kg-v05 h2{font-size:16px;line-height:1.35;margin:0;font-weight:600}#kg-v05 h3{font-size:14px;margin:0 0 6px;font-weight:600}#kg-v05 p{margin:5px 0 0}.kg-sub{color:var(--muted);margin-bottom:20px!important}.kg-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.kg-feature{background:var(--soft);border-color:transparent}.kg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.kg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.kg-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.kg-stat{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:9px}.kg-stat strong{display:block;font-size:19px;font-weight:600}.kg-stat span,.kg-muted{color:var(--muted);font-size:12px}.kg-tag{display:inline-block;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--green);font-size:12px}.kg-tag.warn{background:var(--amberBg);color:var(--amber)}.kg-tag.danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}.kg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.kg-primary{background:var(--green)!important;color:var(--greenText)!important;border-color:var(--green)!important}.kg-list{margin-top:10px}.kg-item{padding:12px 0;border-bottom:1px solid var(--line)}.kg-item:last-child{border-bottom:0}.kg-item strong{font-weight:600}.kg-kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:7px 12px;margin:13px 0 0}.kg-kv dt{color:var(--muted);font-size:12px}.kg-kv dd{margin:0}.kg-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.kg-table th{text-align:left;color:var(--muted);font-size:12px;font-weight:400}.kg-table th,.kg-table td{padding:10px 7px;border-bottom:1px solid var(--line);vertical-align:top}.kg-table tr:last-child td{border-bottom:0}.kg-table button{font-size:12px;padding:5px 8px}.kg-cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(220px,.75fr);gap:14px}.kg-timeline{display:flex;gap:5px;flex-wrap:wrap;margin:15px 0}.kg-step{padding:4px 7px;background:var(--bg);border-radius:6px;color:var(--muted);font-size:12px}.kg-step.on{background:var(--soft);color:var(--green);font-weight:600}.kg-evidence{background:var(--bg);padding:12px;border-radius:9px;margin:10px 0}.kg-evidence blockquote{border-left:2px solid var(--line);padding-left:9px;margin:8px 0;font-size:13px}.kg-select{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}.kg-callout{padding:11px;background:var(--amberBg);color:var(--amber);border-radius:8px;font-size:12px;margin-top:12px}.kg-pillrow{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.kg-empty{text-align:center;padding:30px;color:var(--muted)}#kg-toast:empty{display:none}#kg-toast{margin:0 26px 18px;background:var(--soft);color:var(--text);padding:10px 12px;border-radius:8px}
@media(max-width:800px){#kg-v05{grid-template-columns:minmax(0,1fr)}#kg-v05 .kg-side{border-right:0;border-bottom:1px solid var(--line);padding:15px}.kg-nav{display:flex!important;flex-wrap:wrap}.kg-side-note{display:none}.kg-project{margin:12px 0!important}.kg-main main{padding:18px}}@media(max-width:600px){.kg-grid,.kg-grid3,.kg-cols{grid-template-columns:minmax(0,1fr)}.kg-table{font-size:12px}.kg-table th:nth-child(3),.kg-table td:nth-child(3){display:none}}
</style>
<script>
(()=>{
const root=document.getElementById('kg-v05'),view=root.querySelector('#kg-view'),nav=root.querySelector('.kg-nav'),toast=root.querySelector('#kg-toast');
const pages=[['home','工作台'],['decisions','决策队列'],['tasks','整理任务'],['sources','资料来源'],['knowledge','有效知识'],['rules','处理规则'],['releases','发布与版本'],['agents','Agent 接入'],['settings','预算与权限']];
let state={page:'home',decision:'pending',rule:'draft',repair:'none',release:'none',query:'new'};
const tag=(t,c='')=>`<span class="kg-tag ${c}">${t}</span>`;const btn=(t,a,primary=false)=>`<button type="button" data-action="${a}" class="${primary?'kg-primary':''}">${t}</button>`;const title=(t,s)=>`<h1>${t}</h1><p class="kg-sub">${s}</p>`;
function status(){return state.release==='published'?tag('P-001 已本地生效'):state.repair==='verified'?tag('修订已验证','warn'):state.decision==='confirmed'?tag('规则待试运行','warn'):tag('1 个决策等待处理','warn')}
function home(){return title('把资料维护委托给 AI','当前项目：A 产品资料 · 原件保持不变')+`<section class="kg-card kg-feature"><div class="kg-row"><h2>下一步需要你决定</h2>${status()}</div><h3>价格差异适用于哪些客户？</h3><p>AI 已把 3 份资料、2 条价格差异和 1 份有效合同归为一个问题组。你做一次业务判断，不必逐份审核。</p><div class="kg-actions">${btn('处理这个问题组','decisions',true)}${btn('查看任务证据','tasks')}</div></section><div class="kg-grid3"><div class="kg-stat"><strong>1</strong><span>等待业务决定</span></div><div class="kg-stat"><strong>${state.repair==='verified'?'1':'0'}</strong><span>已验证修订集</span></div><div class="kg-stat"><strong>${state.release==='published'?'1':'0'}</strong><span>当前发布快照</span></div></div><div class="kg-grid"><section class="kg-card"><div class="kg-row"><h2>进行中的维护</h2>${tag('指定范围')}</div><div class="kg-item"><strong>报价与合同口径</strong><br><span class="kg-muted">已检查 5/6 份资料 · 1 份扫描件未可靠读取</span></div><div class="kg-item"><strong>交付周期建议</strong><br><span class="kg-muted">找到会议建议，尚未找到批准依据</span></div>${btn('进入整理任务','tasks')}</section><section class="kg-card"><h2>维护边界</h2><dl class="kg-kv"><dt>负责人</dt><dd>王宁 · 示例</dd><dt>触发</dt><dd>来源、规则或权限变化</dd><dt>自动动作</dt><dd>仅可恢复的派生修订</dd><dt>发布</dt><dd>每次单独确认</dd></dl>${btn('查看预算与权限','settings')}</section></div>`}
function decisions(){const confirmed=state.decision==='confirmed';return title('决策队列','按业务影响聚合；不生成逐文件审批清单')+`<div class="kg-cols"><section class="kg-card"><div class="kg-row"><div><h2>价格适用范围</h2><span class="kg-muted">影响 3 份资料 · 1 条知识视图 · 高影响</span></div>${tag(confirmed?'已形成规则草案':'需要业务确认',confirmed?'':'warn')}</div><div class="kg-evidence"><strong>AI 建议</strong><p>新客户使用已批准且已生效的当前报价；老客户保留有效合同；渠道客户暂不输出统一价格。</p></div><div class="kg-actions">${confirmed?btn('查看规则草案','rules',true):btn('采用建议并形成草案','confirmDecision',true)}${btn('仅本次处理','oneOff')}${btn('暂缓','defer')}</div><div class="kg-callout">采用建议只会创建项目范围的草案；不会发布新知识、覆盖原件或推广到其他项目。</div></section><aside class="kg-card"><h2>影响预览</h2><div class="kg-item"><strong>报价_v2.pdf</strong><br><span class="kg-muted">新客户价格依据</span></div><div class="kg-item"><strong>客户 B 合同</strong><br><span class="kg-muted">老客户例外依据</span></div><div class="kg-item"><strong>渠道报价问题</strong><br><span class="kg-muted">保留为需要澄清</span></div><h3>确认角色</h3><p>业务确认人：王宁</p></aside></div><section class="kg-card"><h2>其他队列项</h2><table class="kg-table"><thead><tr><th>问题组</th><th>影响</th><th>状态</th><th></th></tr></thead><tbody><tr><td>交付周期建议是否获批</td><td>2 份资料</td><td>${tag('待确认','warn')}</td><td>${btn('查看','tasks')}</td></tr><tr><td>扫描附件不可读</td><td>1 个来源</td><td>${tag('需处理','danger')}</td><td>${btn('查看','sources')}</td></tr></tbody></table></section>`}
function tasks(){const phase=state.release==='published'?5:state.repair==='verified'?4:state.decision==='confirmed'?3:2;return title('整理任务：维护价格口径','范围：报价、合同和产品资料 · 默认只读 · 预算 58%')+`<div class="kg-timeline">${['盘点','诊断','决策','修订','发布','持续维护'].map((x,i)=>`<span class="kg-step ${i<phase?'on':''}">${x}</span>`).join('')}</div><div class="kg-cols"><section class="kg-card"><div class="kg-item"><strong>资料治理 Agent</strong><p>已定位价格差异，并排除“文件更新时间更晚就一定更权威”的假设。需要你决定客户适用范围。</p></div>${state.decision==='pending'?`<div class="kg-item"><strong>你</strong><p class="kg-muted">等待业务意见</p>${btn('前往决策队列','decisions',true)}</div>`:`<div class="kg-item"><strong>你 · 示例意见</strong><p>新客户按当前已批准报价；老客户按有效合同；渠道客户另行确认，仅限 A 产品项目。</p></div><div class="kg-item"><strong>资料治理 Agent</strong><p>已生成 R-001 草案。${state.repair==='verified'?'派生修订已通过 3 个验证案例。':'确认规则后才会试运行。'}</p><div class="kg-actions">${state.repair==='verified'?btn('查看修订与发布','releases',true):btn('试运行并生成派生修订','verifyRepair',true)}${btn('查看规则','rules')}</div></div>`}</section><aside class="kg-card"><h2>证据与未完成项</h2><div class="kg-evidence"><small>报价_v2.pdf · 已批准 · 当前生效</small><blockquote>标准客户报价调整为 14,800 元。</blockquote><small>客户B合同.docx · 合同有效</small><blockquote>客户 B 合同金额为 13,800 元。</blockquote></div>${tag('交付周期待确认','warn')}<p class="kg-muted">会议纪要不是批准依据。</p>${tag('扫描件未检查','danger')}<p class="kg-muted">不计入已完成覆盖。</p></aside></div>`}
function sources(){return title('资料来源','授权、版本、读取质量与证据关系')+`<section class="kg-card"><div class="kg-row"><h2>当前范围 · 6 份资料</h2>${tag('5 可读 / 1 未检查','warn')}</div><table class="kg-table"><thead><tr><th>来源</th><th>版本与状态</th><th>关联</th><th></th></tr></thead><tbody><tr><td><strong>产品说明.docx</strong></td><td>${tag('已读取')}<br><span class="kg-muted">当前版本</span></td><td>任务范围</td><td>${btn('详情','sourceDetail')}</td></tr><tr><td><strong>报价_v2.pdf</strong></td><td>${tag('已批准')}<br><span class="kg-muted">已生效</span></td><td>价格依据</td><td>${btn('详情','sourceDetail')}</td></tr><tr><td><strong>客户B合同.docx</strong></td><td>${tag('合同有效')}<br><span class="kg-muted">客户专属</span></td><td>价格例外</td><td>${btn('详情','sourceDetail')}</td></tr><tr><td><strong>会议纪要.md</strong></td><td>${tag('部分待确认','warn')}</td><td>交付周期问题组</td><td>${btn('详情','sourceDetail')}</td></tr><tr><td><strong>扫描附件.pdf</strong></td><td>${tag('无法可靠解析','danger')}</td><td>未检查</td><td>${btn('处理选项','sourceDetail')}</td></tr></tbody></table></section><section class="kg-card"><h2>来源详情 · 模拟</h2><p>暂停监测不删除原件，也不让派生内容立即失效；权限撤回后将限制受影响输出并请求选择保留策略。</p><div class="kg-actions">${btn('追加资料','noticeUpload')}${btn('缩小范围','noticeScope')}${btn('暂停监测','noticePause')}</div></section>`}
function knowledge(){const published=state.release==='published';const answer=state.query==='new'?'新客户：14,800 元，当前已批准且已生效的报价。':state.query==='old'?'老客户：以该客户的有效合同为准；示例客户 B 为 13,800 元。':'渠道客户：信息不足，需要业务确认，不能输出统一价格。';return title('有效知识','按条件交付当前可用依据')+`<section class="kg-card"><div class="kg-row"><h2>价格口径</h2>${published?tag('P-001 当前生效'):tag('草稿，不对外提供','warn')}</div><table class="kg-table"><thead><tr><th>条件</th><th>结论</th><th>来源</th><th>状态</th></tr></thead><tbody><tr><td>新客户</td><td>14,800 元</td><td>报价_v2.pdf</td><td>${tag(published?'已发布':'待发布',published?'':'warn')}</td></tr><tr><td>老客户</td><td>按有效合同</td><td>客户合同</td><td>${tag(published?'已发布':'待发布',published?'':'warn')}</td></tr><tr><td>渠道客户</td><td>请求澄清</td><td>无充分依据</td><td>${tag('受限','warn')}</td></tr></tbody></table></section><section class="kg-card"><h2>试读有效知识</h2><select class="kg-select" id="kg-query"><option value="new">新客户 · 业务日期在当前生效期</option><option value="old">老客户 · 有效合同</option><option value="channel">渠道客户 · 条件不足</option></select><div class="kg-evidence" aria-live="polite">${answer}</div><p class="kg-muted">${published?'模拟返回：内容、条件、来源、发布版本和未解决事项。':'发布前只能在本项目试读，外部 Agent 不能读取。'}</p></section>`}
function rules(){return title('处理规则','可复用的处理方式，不是聊天记忆')+`<section class="kg-card"><div class="kg-row"><h2>R-001 · 项目价格处理</h2>${tag(state.decision==='confirmed'?'草案待试运行':'尚未形成','warn')}</div><p>新客户使用已批准且已生效的报价；老客户使用有效合同；渠道客户条件不足时请求澄清。</p><dl class="kg-kv"><dt>作用范围</dt><dd>仅 A 产品项目</dd><dt>允许动作</dt><dd>生成可恢复的派生修订</dd><dt>明确例外</dt><dd>渠道客户、合同失效、未来生效价格</dd><dt>不包含</dt><dd>原件覆盖、自动发布、跨项目推广</dd><dt>验证样本</dt><dd>新客户／客户 B／渠道客户</dd></dl><div class="kg-actions">${state.decision==='confirmed'?btn('开始试运行','verifyRepair',true):btn('先处理决策','decisions',true)}${btn('修改范围','noticeRule')}</div></section><section class="kg-grid"><div class="kg-card"><h2>影响预览</h2><p>新版本将影响 1 个待发布修订集，不改写任何已执行历史。</p></div><div class="kg-card"><h2>规则版本</h2><p>R-001 v0 草案 → 试运行 → 已生效 → 替代／撤销</p></div></section>`}
function releases(){const verified=state.repair==='verified',published=state.release==='published';return title('修订、发布与版本','生成、验证、发布和下游同步各有独立状态')+`<div class="kg-grid3"><div class="kg-stat"><strong>${verified?'完成':'等待'}</strong><span>派生修订</span></div><div class="kg-stat"><strong>${verified?'通过':'未开始'}</strong><span>验证案例</span></div><div class="kg-stat"><strong>${published?'本地生效':'未发布'}</strong><span>发布快照</span></div></div><section class="kg-card"><div class="kg-row"><h2>P-001 · 价格知识</h2>${published?tag('本服务已生效'):tag(verified?'等待发布':'等待验证','warn')}</div><div class="kg-evidence"><small>修订前</small><blockquote>全部客户统一采用最新标准报价。</blockquote><small>修订后</small><blockquote>新客户采用当前报价；老客户按有效合同；渠道客户请求澄清。</blockquote></div><dl class="kg-kv"><dt>输入</dt><dd>报价_v2、客户 B 合同、R-001</dd><dt>验证</dt><dd>${verified?'3/3 适用性案例通过':'尚未开始'}</dd><dt>未解决</dt><dd>交付周期、扫描附件</dd><dt>发布人</dt><dd>项目所有者 · 示例</dd><dt>下游</dt><dd>${published?'未连接，尚未验证同步':'尚未发布'}</dd></dl><div class="kg-actions">${!verified?btn('返回任务验证','tasks',true):!published?btn('确认发布 P-001','publish',true):btn('查看有效知识','knowledge',true)}${btn('查看版本历史','noticeHistory')}</div></section><section class="kg-card"><h2>发布守则</h2><p>未解决事项可保留在发布外，但不能被伪装成已修复。恢复历史版本将生成新的发布快照并重新确认。</p></section>`}
function agents(){return title('Agent 接入','让现有 Agent 使用受治理的结果')+`<section class="kg-card"><div class="kg-row"><h2>示例调用方 · 销售助手</h2>${tag('未连接真实服务','warn')}</div><div class="kg-grid3"><div class="kg-stat"><strong>读取</strong><span>已发布知识</span></div><div class="kg-stat"><strong>提案</strong><span>提交问题线索</span></div><div class="kg-stat"><strong>禁止</strong><span>确认、发布、覆盖</span></div></div><dl class="kg-kv"><dt>项目范围</dt><dd>A 产品资料</dd><dt>调用上下文</dt><dd>客户类型、业务日期、调用方身份</dd><dt>返回内容</dt><dd>结论、条件、来源、版本、未解决事项</dd></dl></section><section class="kg-card"><h2>调用记录 · 示例</h2><table class="kg-table"><thead><tr><th>时间</th><th>请求</th><th>结果</th></tr></thead><tbody><tr><td>10:24</td><td>查询新客户价格</td><td>${tag(state.release==='published'?'返回 P-001':'无已发布内容',state.release==='published'?'':'warn')}</td></tr><tr><td>10:26</td><td>查询渠道价格</td><td>${tag('返回澄清请求','warn')}</td></tr></tbody></table></section>`}
function settings(){return title('预算与权限','将自动化边界、维护节奏与成本行为写清楚')+`<section class="kg-grid"><div class="kg-card"><h2>持续维护</h2><dl class="kg-kv"><dt>触发</dt><dd>来源、规则、解析方法或权限变化</dd><dt>检查</dt><dd>先确定性检查，再候选语义分析</dd><dt>通知</dt><dd>待决定、阻塞、预算临界、同步失败</dd><dt>静默</dt><dd>无实质变化的例行检查</dd></dl></div><div class="kg-card"><h2>授权边界</h2><dl class="kg-kv"><dt>读取</dt><dd>6 份指定资料</dd><dt>修订</dt><dd>仅派生版本</dd><dt>规则</dt><dd>项目级，不自动扩域</dd><dt>发布</dt><dd>项目所有者逐次确认</dd></dl></div></section><section class="kg-card"><h2>任务预算</h2><div class="kg-grid3"><div class="kg-stat"><strong>58%</strong><span>本次已使用</span></div><div class="kg-stat"><strong>27%</strong><span>预留验证</span></div><div class="kg-stat"><strong>15%</strong><span>未分配</span></div></div><div class="kg-callout">预算不足时保存检查点、说明未检查范围；由用户选择缩小范围、继续或延期。不会把未处理内容标为已检查。</div></section>`}
const render=()=>{nav.innerHTML=pages.map(([id,label])=>`<button type="button" data-page="${id}" ${id===state.page?'aria-current="page"':''}>${label}</button>`).join('');root.querySelector('#kg-breadcrumb').textContent=pages.find(x=>x[0]===state.page)?.[1]||'';view.innerHTML=({home,decisions,tasks,sources,knowledge,rules,releases,agents,settings})[state.page]();const q=view.querySelector('#kg-query');if(q)q.value=state.query};
const say=t=>{toast.textContent=t};
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action||b.dataset.page;if(!a)return;if(pages.some(x=>x[0]===a)){state.page=a;say('');}else if(a==='confirmDecision'){state.decision='confirmed';state.page='rules';say('已创建 R-001 项目规则草案；尚未修订或发布。');}else if(a==='verifyRepair'){if(state.decision!=='confirmed'){state.page='decisions';say('请先确认规则范围。')}else{state.repair='verified';state.page='releases';say('模拟试运行完成：3 个适用性案例通过，等待单独发布。');}}else if(a==='publish'){if(state.repair==='verified'){state.release='published';state.page='knowledge';say('模拟发布 P-001；未连接下游，尚未验证同步。');}}else if(a==='oneOff'){say('已选择仅本次处理：不会写入持久规则。');}else if(a==='defer'){say('问题组已暂缓；AI 仅继续已授权且不依赖此决定的工作。');}else if(a.startsWith('notice'))say('这是概念原型中的操作入口；真实权限、来源和后台任务尚未连接。');render();});
root.addEventListener('change',e=>{if(e.target.id==='kg-query'){state.query=e.target.value;render();}});render();
})();
</script>
