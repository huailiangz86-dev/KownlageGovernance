[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-governance"
version = "0.1.0"
description = "Knowledge governance platform"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy==2.0.31",
  "alembic==1.13.2",
  "PyMySQL==1.1.0",
  "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]
